<div class="blurb">战火平息，伊斯的儿子景净长大了。他把西方的经卷一卷一卷译成唐人的话，又亲手写下一块石碑。他心里一直压着一件事：他的生父是一位立过誓的主教，生母是长安西市后巷里的一个女子。三十年后，他们重逢；三天后，一把削笔的小刀，让这件事重新沉进了井底。</div>
<div class="q"><div class="a">法流十道，国富元休；寺满百城，家殷景福。</div><div class="b">——《大秦景教流行中国碑》</div></div>
