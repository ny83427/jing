<div class="blurb">天宝十四载，安禄山起兵范阳。吐火罗人伊斯，长安大秦寺的一名僧人，在黄河边的一个小镇上被郭子仪收在帐下。他不领兵，不冲阵，只替郭公看路。从常山的雪到香积寺的雾，从长安的粥棚到灵州的城门，一个不肯杀人的人，在一场杀人如麻的战争里，守着他的主，也守着身边的人。</div>
<div class="q"><div class="a">为公爪牙，作军耳目。</div><div class="b">——《大秦景教流行中国碑》</div></div>
