<div class="blurb">会昌五年，一道敕书传遍天下。大秦寺被封，外国僧人送还本处。景净的门生景福在夜里带人把那块碑埋进土里，又在离开长安的那天早上，留下一声叫人含泪而笑的响动。他们出萧关，过玉门，散向粟特、草原和巴格达，像风一样，不知从哪里来，往哪里去。</div>
<div class="q"><div class="a">真常之道，妙而难名。</div><div class="b">——《大秦景教流行中国碑》</div></div>
